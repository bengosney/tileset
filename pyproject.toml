[project]
name = "TilesetGen"
version = "0.0.1"
description = "Tileset Generator"
authors = [{ name = "Ben Gosney", email = "bengosney@googlemail.com" }]
requires-python = ">=3.10"
dependencies = [
    "click",
    "opensimplex",
    "pillow",
]

[project.optional-dependencies]
dev = [
    "black",
    "icecream",
    "pre-commit",
    "pytest",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 128
target-version = ['py310']

[tool.pycln]
all = true
